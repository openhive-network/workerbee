# Profile for hive/workerbee, written by `aidev project scaffold` (#13561).
#
# Schema reference: docs/architecture/project-profile.md
# Onboarding procedure: the `onboard-external-project` skill.
# Guide: docs/operations/onboarding-an-external-project.md
#
# The generator writes a starting point, not a governed answer: every
# binding below is the command a maintainer said this project runs, and it
# is reviewed and edited like any other declaration.
version: 2
project: workerbee

gitlab:
  host: "gitlab.syncad.com"
  path: "hive/workerbee"
  id: 452

# A single-branch topology: this is both what work integrates into and what
# ships. `stable` is omitted rather than declared equal to it — declaring
# them equal is a typo, omitting one is a topology. Add `stable:` when this
# project genuinely promotes to a second branch.
# AIDEV integrates into its own branch; people merge it into main through merge
# requests, so `stable` is omitted and `aidev release` never moves main.
branches:
  integration: "aidev/integration"
  # main is protected and fast-forward only: hand off by merge request, as a
  # linear one-commit-per-change copy (aidev docs/operations/project-handoff.md).
  handoff: "main"
  handoff_history: "linear"

# How this project's suites execute (#13892): one kind, stated once.
environment:
  kind: "container"
  image: "registry.gitlab.syncad.com/hive/workerbee/aidev-tests@sha256:c06ce3a6b7093568a0ac383db00e4af429e538b650be7a7e48ceaecf56afc132"
  inputs: ["pnpm-lock.yaml", ".aidev/runtime/Dockerfile"]

issues:
  intake_label: todo
  taxonomy: ".aidev/labels.yaml"
  decompose:
    # `never` is where an external project starts: nothing marks work
    # approved on this project's behalf until there is a track record.
    auto_todo: never
  # Reports about this project's work are filed against this project.
  watcher_reports: self

# Verification slots. Each binding is what this project genuinely runs for
# that slot — never one selection repeated under seven names, which makes
# seven gates report on the same evidence while claiming to check seven
# different things.
# workerbee_testsuite (Playwright, 89 tests, ~1 min) is bound as test: its tests
# replay recorded API calls (__tests__/assets/api-recordings), so they run with
# --network none. typecheck covers all of __tests__. workerbee_testsuite_mock
# (31 tests, ~6 min, one serial file) runs in full and baseline as three suites
# of ~2 min (test-mock-a/b/c, split by test title), because AIDEV gives each
# non-pytest suite a ~300 s wall; it stays out of quick and canary. See
# .aidev/README.md.
# full's and baseline's suites are concurrent: each is its own --network none
# container, so the mock suites' fixed ports never meet, and they share the
# checkout's dist/ and node_modules through run-checks.sh's locks: the first
# suite to reach `build` builds, the rest wait and test that build. memory: is
# above each suite's fleet p95 memory.peak before this change (18 runs, Nov 2026:
# checks 2.0 GiB, each mock suite 0.8 GiB including the build one of them now runs).
verification:
  quick:
    adapter: command
    args: [".aidev/run-checks.sh", "quick", "lint", "typecheck", "build", "test"]
    artifacts: ["test-results/quick/"]
  full:
    suites:
      - name: checks
        adapter: command
        args: [".aidev/run-checks.sh", "full", "lint", "typecheck", "build", "docs", "test"]
        artifacts: ["test-results/full/"]
        stack: false
        concurrent: true
        memory: 3g
      - name: mock_a
        adapter: command
        args: [".aidev/run-checks.sh", "full-mock-a", "build", "test-mock-a"]
        artifacts: ["test-results/full-mock-a/"]
        stack: false
        concurrent: true
        memory: 1.5g
      - name: mock_b
        adapter: command
        args: [".aidev/run-checks.sh", "full-mock-b", "build", "test-mock-b"]
        artifacts: ["test-results/full-mock-b/"]
        stack: false
        concurrent: true
        memory: 1.5g
      - name: mock_c
        adapter: command
        args: [".aidev/run-checks.sh", "full-mock-c", "build", "test-mock-c"]
        artifacts: ["test-results/full-mock-c/"]
        stack: false
        concurrent: true
        memory: 1.5g
  baseline:
    suites:
      - name: mock_a
        adapter: command
        args: [".aidev/run-checks.sh", "baseline-mock-a", "build", "test-mock-a"]
        artifacts: ["test-results/baseline-mock-a/"]
        stack: false
        concurrent: true
        memory: 1.5g
      - name: mock_b
        adapter: command
        args: [".aidev/run-checks.sh", "baseline-mock-b", "build", "test-mock-b"]
        artifacts: ["test-results/baseline-mock-b/"]
        stack: false
        concurrent: true
        memory: 1.5g
      - name: mock_c
        adapter: command
        args: [".aidev/run-checks.sh", "baseline-mock-c", "build", "test-mock-c"]
        artifacts: ["test-results/baseline-mock-c/"]
        stack: false
        concurrent: true
        memory: 1.5g
  canary:
    adapter: command
    args: [".aidev/run-checks.sh", "canary", "lint", "typecheck", "build", "test"]
    artifacts: ["test-results/canary/"]
  static:
    adapter: command
    args: [".aidev/run-checks.sh", "static", "lint", "typecheck"]
    artifacts: ["test-results/static/"]
  coverage:
    adapter: command
    args: [".aidev/run-checks.sh", "coverage", "build", "test-mock"]
    artifacts: ["test-results/coverage/"]
  system:
    adapter: command
    args: [".aidev/run-checks.sh", "system", "build", "docs"]
    artifacts: ["test-results/system/"]

# Capability grants for target-side code. Empty until this project needs one.
capabilities: []
