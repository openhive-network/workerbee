[build-system]
requires = [
    "poetry-core>=1.7.0",
    "poetry-dynamic-versioning>=1.0.0,<2.0.0",
]
build-backend = "poetry_dynamic_versioning.backend"


[tool.poetry]
requires-poetry = "2.1.3"
name = "hiveio-workerbee"
version = "0.0.0"
description = "Hive blockchain automation library — Python port of TS library @hiveio/workerbee"
authors = ["Hive Community <hive@openhive.network>"]
license = "MIT"
readme = "README.md"
homepage = "https://gitlab.syncad.com/hive/workerbee"
repository = "https://gitlab.syncad.com/hive/workerbee"
documentation = "https://gitlab.syncad.com/hive/workerbee/-/tree/develop/python"
keywords = ["hive", "blockchain", "automation", "bot", "observer"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
packages = [
    { include = "workerbee" },
]

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }


[tool.poetry.dependencies]
# hiveio-wax requires Python >=3.12, so that is the effective floor.
python = ">=3.12,<4"
hiveio-wax = "2.0.2.dev20260622105138"


# hiveio-* post-release builds (from develop) live in the Hive GitLab PyPI registry.
[[tool.poetry.source]]
name = "gitlab-hive"
url = "https://gitlab.syncad.com/api/v4/groups/136/-/packages/pypi/simple"
priority = "primary"


[tool.poetry.group.static-analysis.dependencies]
mypy = ">=1.10"
ruff = "0.12.9"
pre-commit = "4.2.0"
pre-commit-hooks = "4.3.0"
codespell = "2.2.4"
detect-missing-init-files = {url = "https://github.com/lk16/detect-missing-init/archive/refs/tags/v0.1.6.zip"}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
coverage = ">=7.0"
pyyaml = ">=6.0"
pytest-xdist = "^3.8.0"


[tool.poetry-dynamic-versioning]
enable = true
pattern = "default-unprefixed"
# PEP 440 compliant versioning with .post{timestamp}
# https://peps.python.org/pep-0440/
#
# Version examples (assuming last tag is 1.0.0):
#   Tag (distance=0, clean):       1.0.0
#   Tag (distance=0, dirty):       1.0.0+dirty
#   develop (distance>0):          1.0.0.post20260130132734
#   develop (dirty):               1.0.0.post20260130132734+dirty
#   feature branch (distance>0):   1.0.0.post20260130132734.dev0+unstable
#   feature branch (dirty):        1.0.0.post20260130132734.dev0+unstable.dirty
#
# Logic:
#   - distance=0         -> exact tag version
#   - distance>0, stable -> tag + .post{timestamp}
#   - distance>0, unstable -> tag + .post{timestamp}.dev0+unstable
#   - dirty              -> + 'dirty' marker
#
# Stability detection:
#   - stable: develop/master/main branches OR tag checkout (detached HEAD with distance=0)
#   - unstable: feature branches OR detached HEAD with distance>0
#   - CI: GitLab checks out as detached HEAD, so branch is None;
#     use CI_COMMIT_REF_NAME env var as fallback for branch detection
format-jinja = """
    {%- set STABLE_BRANCHES = ['develop', 'master', 'main'] -%}

    {%- set effective_branch = branch or env.get('CI_COMMIT_REF_NAME') -%}
    {%- set is_on_tag = distance == 0 -%}
    {%- set is_after_tag = distance > 0 -%}
    {%- set is_tag_checkout = branch is none and is_on_tag -%}
    {%- set is_stable = effective_branch in STABLE_BRANCHES or is_tag_checkout -%}
    {%- set is_feature_branch = is_after_tag and not is_stable -%}

    {%- set post = timestamp|int if is_after_tag else none -%}
    {%- set dev = 0 if is_feature_branch else none -%}
    {%- set local_parts = ['unstable'] if is_feature_branch else [] -%}
    {%- set local_parts = local_parts + ['dirty'] if dirty else local_parts -%}

    {{ serialize_pep440(base, stage, revision, post=post, dev=dev, metadata=local_parts) }}
"""


[tool.mypy]
# Matches the project's Python floor (the package requires >=3.12 because
# hiveio-wax does). Both the CLI gate and the editor (Mypy extension) read this,
# so 3.11+ stdlib (asyncio.timeout, typing.Self) is recognised, not false-flagged.
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "jsonrpc_mock: tests using the TypeScript JSON-RPC mock server; run sequentially",
]

[tool.coverage.run]
source = ["workerbee/chain_observers"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "BLE", "S", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106", "S603"]

[tool.codespell]
skip = "*.lock,*.json,pnpm-lock.yaml,examples/hive,generated,python/generated,python/generated_by_package_fixtures"
